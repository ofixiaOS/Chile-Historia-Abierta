services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chile_historia_abierta
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_postgres_password
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d chile_historia_abierta']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - cha_postgres_data:/var/lib/postgresql
      - ./database/bootstrap:/docker-entrypoint-initdb.d:ro
    restart: 'no'

volumes:
  cha_postgres_data:
